[workspace]
resolver = "2"
members = [
    "crates/workspace-core",
    "crates/workspace-linux",
    "crates/workspace-share",
    "crates/workspace-nautilus",
    "crates/workspace-android",
]

[workspace.package]
version = "1.0.0-ant"
edition = "2024"
license = "MIT"
authors = ["edfork"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
blake3 = { version = "1", features = ["pure"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
futures-util = "0.3"
hkdf = "0.12"
hostname = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
cc = "1"
pkg-config = "0.3"
hyper = { version = "1.8", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "http1"] }
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["io-util"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.19", features = ["v4"] }
x509-parser = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1.8"

workspace-core = { path = "crates/workspace-core" }
